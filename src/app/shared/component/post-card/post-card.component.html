<div class="card h-100">
    <div class="card-header bg-info text-light">
         <h3>{{postObj.title}}</h3>
    </div>
     <div class="card-body">
        <p>{{postObj.body}}</p>

    </div>
     <div class="card-footer  d-flex justify-content-between">
          <button class="btn btn-outline-primary" (click)="onEditObj(postObj)">Edit</button>
          <button class="btn btn-outline-danger" (click)="OnRemove(postObj.id)">Remove</button>
     </div>
</div>
