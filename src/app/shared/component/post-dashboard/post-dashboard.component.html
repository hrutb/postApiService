<div class="container">
    <div class="row">
       <div class="col-md-6 mt-5 mb-4">
         <app-post-form (newProdObj)="getNewPost($event)" (emitUpdateObj)="onUpdate($event)"></app-post-form>
        </div>
      </div>
      <div class="row">

        <div class="col-md-4 mt-5 mb-4"  *ngFor="let post of postArr ; trackBy:trackPost" >
           <app-post-card [postObj]="post" (removeObjId)="onRemove($event)"></app-post-card>
        </div>
      </div>
</div>
